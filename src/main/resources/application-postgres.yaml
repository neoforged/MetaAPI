# PostgreSQL profile for production/HA deployments
# Activate with: --spring.profiles.active=postgres

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/metaapi}
    username: ${DB_USERNAME:metaapi}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate  # Flyway manages schema; validate ensures they match
    properties:
      hibernate:
        # format_sql: true
        # show_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

# Job scheduler configuration for HA mode
job-scheduler:
  # How often to poll for jobs that need to run
  poll-interval: 10s
