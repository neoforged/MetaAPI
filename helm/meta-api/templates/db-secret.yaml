{{/*
Chart-managed database credentials secret. Only rendered when the user does NOT
point at an existing Secret (database.existingSecret empty); otherwise inline
credentials are ignored and the pre-existing Secret is used as-is.
*/}}
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "meta-api.fullname" .) }}
  labels:
    {{- include "meta-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ required "database.url is required when database.existingSecret is empty (e.g. jdbc:postgresql://db-host:5432/metaapi)" .Values.database.url | quote }}
  username: {{ required "database.username is required when database.existingSecret is empty" .Values.database.username | quote }}
  # May be left empty for databases without password authentication.
  password: {{ .Values.database.password | default "" | quote }}
{{- end }}
