{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "meta-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "meta-api.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "gateway.parentRef.name is required when gateway.enabled=true (name of the Gateway)" .Values.gateway.parentRef.name }}
      namespace:  {{ required "gateway.parentRef.namespace is required when gateway.enabled=true (namespace of the Gateway)" .Values.gateway.parentRef.namespace }}
      sectionName:  {{ required "gateway.parentRef.sectionName is required when gateway.enabled=true (section of the Gateway)" .Values.gateway.parentRef.sectionName }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    # No explicit matches: per the Gateway API spec this defaults to a PathPrefix
    # match on "/" for all methods, which is what we want (the app serves /).
    - backendRefs:
      - name: {{ include "meta-api.fullname" . }}
        port: {{ required "service.port is required when gateway.enabled=true" .Values.service.port }}
{{- end }}
